name: Web and Codex regression
on:
  push:
    branches: [main, feat/codex-subscription-images-20260920, hotfix/codex-bridge-import-20260920, fix/exact-size-input-20260920]
    paths: ['src/**', 'tests/**', 'tools/**', 'deploy/**', 'pyproject.toml', 'web_dockerfile', '.github/workflows/web-regression.yml']
  pull_request:
    branches: [main]
concurrency:
  group: web-regression-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python regression and JavaScript syntax
        run: |
          pip install -e '.[web,dev]' playwright
          pytest -q
          python -m compileall -q src/nano_banana deploy
          for file in src/web/static/*.js; do node --check "$file"; done
      - name: Real browser smoke test with mocked providers
        run: |
          python -m playwright install --with-deps chromium
          python tools/browser_smoke.py
      - name: Build both production images
        run: |
          docker build -f web_dockerfile -t nano-web:regression .
          docker build -f deploy/codex.Dockerfile -t nano-codex:regression .
      - name: Start isolated read-only bridge and existing API Web without login
        run: |
          mkdir -p /tmp/nano-auth /tmp/nano-secrets
          python -c 'import secrets; from pathlib import Path; Path("/tmp/nano-secrets/token").write_text(secrets.token_hex(32))'
          sudo chown 10001:10001 /tmp/nano-auth /tmp/nano-secrets/token
          sudo chmod 700 /tmp/nano-auth
          sudo chmod 600 /tmp/nano-secrets/token
          docker network create nano-regression
          docker run -d --name nano-codex-test --network nano-regression --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /run/nano-codex:rw,size=512m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:rw,size=256m,mode=1777 \
            -v /tmp/nano-auth:/var/lib/nano-codex \
            -v /tmp/nano-secrets/token:/run/secrets/codex-bridge-token:ro nano-codex:regression
          docker run -d --name nano-web-test --network nano-regression \
            -e CODEX_BRIDGE_URL=http://nano-codex-test:8787 \
            -e CODEX_BRIDGE_TOKEN_FILE=/run/secrets/codex-bridge-token \
            -v /tmp/nano-secrets/token:/run/secrets/codex-bridge-token:ro nano-web:regression
          sleep 3
          docker exec nano-web-test python -c 'import urllib.request,json; u="http://127.0.0.1:5000"; d=json.load(urllib.request.urlopen(u+"/api/config")); assert "chat_engine" in d; d=json.load(urllib.request.urlopen(u+"/api/generate-image/capacity")); assert d["workers"]==4; print("Web health OK")'
          docker exec nano-codex-test python -c 'import urllib.request,json,pathlib; t=pathlib.Path("/run/secrets/codex-bridge-token").read_text(); r=urllib.request.Request("http://127.0.0.1:8787/health",headers={"Authorization":"Bearer "+t}); assert json.load(urllib.request.urlopen(r))["ok"]; print("Bridge health OK")'
          docker exec nano-codex-test python -c 'from nano_banana.codex_bridge.runtime import probe_status; d=probe_status(); assert not d["logged_in"]; print("Unauthenticated capability probe:",d)'
          test -z "$(docker port nano-codex-test)"
      - name: Verify real deployment transaction and rollback
        run: sudo --preserve-env=PATH python tools/deployment_smoke.py
      - name: Logs on failure
        if: failure()
        run: |
          docker logs nano-web-test || true
          docker logs nano-codex-test || true
