name: Validate upstream integration

on:
  push:
    branches:
      - sync/upstream-2026-08-19
    paths:
      - '.github/workflows/validate-upstream-integration.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install all test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[web,dev]'

      - name: Run complete test suite
        run: pytest -q

      - name: Validate JavaScript syntax
        run: |
          node --check src/web/static/script.js
          node --check src/web/static/image-gen.js
          node --check src/web/static/ai-stream.js
          node --check src/web/static/structured-ui.js

      - name: Build production Web Docker image
        run: docker build --pull -f web_dockerfile -t nano-banana-web:integration-test .
