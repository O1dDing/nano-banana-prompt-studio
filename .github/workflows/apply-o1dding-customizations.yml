name: Apply O1dDing customizations

on:
  push:
    paths:
      - '.github/patches/nano-banana-merged.part-*'
      - '.github/workflows/apply-o1dding-customizations.yml'

permissions:
  contents: write

jobs:
  apply-custom-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect existing customization
        id: detect
        shell: bash
        run: |
          if grep -q 'chat_web_search_mode' src/utils/ai_config.py \
             && grep -q 'waitForImageTask' src/web/static/script.js \
             && grep -q 'generate-image/status' src/web/app.py; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize target line endings
        if: steps.detect.outputs.already != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('src/web/app.py', 'src/web/static/script.js', 'src/utils/ai_config.py'):
              p = Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          PY

      - name: Rebuild patch
        if: steps.detect.outputs.already != 'true'
        shell: bash
        run: |
          cat .github/patches/nano-banana-merged.part-* > /tmp/nano-banana-merged.patch
          sha256sum /tmp/nano-banana-merged.patch

      - name: Verify patch with fuzz
        if: steps.detect.outputs.already != 'true'
        shell: bash
        run: patch --batch --dry-run --forward --fuzz=3 -p1 < /tmp/nano-banana-merged.patch

      - name: Apply custom patch
        if: steps.detect.outputs.already != 'true'
        shell: bash
        run: patch --batch --forward --fuzz=3 -p1 < /tmp/nano-banana-merged.patch

      - name: Validate Python and JavaScript
        if: steps.detect.outputs.already != 'true'
        shell: bash
        run: |
          python3 -m py_compile src/web/app.py src/utils/ai_config.py src/utils/stage1_web_search.py
          node --check src/web/static/script.js
          grep -q 'chat_web_search_mode' src/utils/ai_config.py
          grep -q 'waitForImageTask' src/web/static/script.js
          grep -q 'generate-image/status' src/web/app.py

      - name: Commit customized source
        if: steps.detect.outputs.already != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/app.py src/web/static/script.js src/utils/ai_config.py src/utils/stage1_web_search.py
          git commit -m 'feat(web): 增加第一阶段联网控制并异步化图片生成'
          git push origin HEAD:main

# bootstrap-trigger-v4
