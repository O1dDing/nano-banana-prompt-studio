name: Cleanup O1dDing bootstrap files

on:
  push:
    paths:
      - '.github/workflows/apply-o1dding-customizations.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify custom source exists
        shell: bash
        run: |
          test -f src/utils/stage1_web_search.py
          grep -q 'chat_web_search_mode' src/utils/ai_config.py
          grep -q 'waitForImageTask' src/web/static/script.js
          grep -q 'generate-image/status' src/web/app.py

      - name: Remove temporary bootstrap files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/source-bundle .github/patches .github/workflows/apply-o1dding-customizations.yml
          git commit -m 'chore: 清理临时迁移文件'
          git push origin HEAD:main
