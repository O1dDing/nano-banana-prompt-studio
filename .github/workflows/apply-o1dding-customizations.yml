name: Diagnose O1dDing source bundle

on:
  push:
    paths:
      - '.github/workflows/apply-o1dding-customizations.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show bundle part sizes and hashes
        shell: bash
        run: |
          wc -c .github/source-bundle/custom-src.b64.part-*
          sha256sum .github/source-bundle/custom-src.b64.part-*
