name: Validate Access deployment probes
on:
  push:
    branches: [feat/cloudflare-profiles-admins-20260921]
    paths: [.github/workflows/integrate-access.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Use plain HTTP probe without nested exec escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('deploy/update_nano_banana_codex.py')
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'import json,urllib.request,urllib.error;' in line]
          assert len(matches) == 1
          code = ("import http.client,json; c=http.client.HTTPConnection('127.0.0.1',5000,timeout=3); "
                  "c.request('GET','/api/health'); r=c.getresponse(); assert r.status==200; "
                  "assert json.loads(r.read())['access_identity']; "
                  "c.request('GET','/api/config'); r=c.getresponse(); assert r.status==403; "
                  "assert json.loads(r.read())['access_required']; c.close(); "
                  "print('Access runtime and unauthenticated-request rejection OK')")
          compile(code, '<access-probe>', 'exec')
          lines[matches[0]] = "            run('docker', 'exec', args.container, 'python', '-c', " + repr(code) + ")"
          raw = '\n'.join(lines) + '\n'
          compile(raw, str(p), 'exec')
          p.write_text(raw)
          PY
      - name: Commit and pin reviewed updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/update_nano_banana_codex.py
          git commit -m 'fix(deploy): 使用可直接执行的 Access HTTP 健康检查'
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          blob = subprocess.check_output(['git','hash-object','deploy/update_nano_banana_codex.py'], text=True).strip()
          p = Path('deploy/update_nano_banana_codex.sh')
          s = re.sub(r"SOURCE_COMMIT='[^']+'", "SOURCE_COMMIT='"+sha+"'", p.read_text())
          s = re.sub(r"EXPECTED_BLOB='[^']+'", "EXPECTED_BLOB='"+blob+"'", s)
          p.write_text(s)
          PY
          bash -n deploy/update_nano_banana_codex.sh
          git add deploy/update_nano_banana_codex.sh
          git commit -m 'chore(deploy): 锁定通过语法预检的 Access 更新器'
          git push origin HEAD:feat/cloudflare-profiles-admins-20260921
