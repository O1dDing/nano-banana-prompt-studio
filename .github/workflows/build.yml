name: 🚀 Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  fix-openai-image-mime:
    name: 🩹 Fix OpenAI Images input MIME
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🩹 Patch MIME upload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/image_clients.py')
          text = path.read_text(encoding='utf-8')
          if '_detect_openai_input_mime' in text:
              print('MIME fix already present; nothing to patch.')
              raise SystemExit(0)

          pattern = re.compile(
              r'    def _edit_image\(self, images: list\[str\], kwargs: dict\[str, Any\]\):\n'
              r'.*?'
              r'(?=\n    @staticmethod\n    def _extract_image)',
              re.S,
          )
          replacement_lines = [
              '    @staticmethod',
              '    def _detect_openai_input_mime(image_path: str) -> tuple[str, str]:',
              '        """按实际图片内容识别 OpenAI Images 支持的 MIME，并生成匹配扩展名的上传文件名。"""',
              '        format_map = {',
              '            "JPEG": ("image/jpeg", ".jpg"),',
              '            "PNG": ("image/png", ".png"),',
              '            "WEBP": ("image/webp", ".webp"),',
              '        }',
              '        try:',
              '            with Image.open(image_path) as image:',
              '                image_format = (image.format or "").upper()',
              '                image.verify()',
              '        except Exception as exc:',
              '            raise ValueError(f"无法识别或读取参考图: {image_path}: {exc}") from exc',
              '',
              '        if image_format not in format_map:',
              '            raise ValueError(',
              '                f"OpenAI Images 参考图仅支持 JPEG、PNG、WebP；实际格式为 {image_format or chr(39) + "unknown" + chr(39)}"',
              '            )',
              '',
              '        mime_type, extension = format_map[image_format]',
              '        stem = os.path.splitext(os.path.basename(image_path))[0] or "image"',
              '        return mime_type, f"{stem}{extension}"',
              '',
              '    def _edit_image(self, images: list[str], kwargs: dict[str, Any]):',
              '        opened_files = []',
              '        upload_files = []',
              '        try:',
              '            for image_path in images:',
              '                if not os.path.isfile(image_path):',
              '                    raise ValueError("OpenAI Images 编辑模式需要本地图片文件路径")',
              '',
              '                mime_type, upload_name = self._detect_openai_input_mime(image_path)',
              '                file_obj = open(image_path, "rb")',
              '                opened_files.append(file_obj)',
              '                # OpenAI Python SDK 支持 (filename, contents, media_type)。',
              '                # 显式提供 MIME，避免 WebP/JPEG/PNG 被 multipart 退化为 application/octet-stream。',
              '                upload_files.append((upload_name, file_obj, mime_type))',
              '',
              '            image_arg = upload_files[0] if len(upload_files) == 1 else upload_files',
              '            return self.client.images.edit(image=image_arg, **kwargs)',
              '        finally:',
              '            for file_obj in opened_files:',
              '                file_obj.close()',
          ]
          replacement = '\n'.join(replacement_lines) + '\n'
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'patch target mismatch: expected 1, got {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: ✅ Validate and commit
        shell: bash
        run: |
          python3 -m py_compile src/components/image_clients.py
          grep -q '_detect_openai_input_mime' src/components/image_clients.py
          grep -q 'upload_files.append((upload_name, file_obj, mime_type))' src/components/image_clients.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/image_clients.py
          if git diff --cached --quiet; then
            echo 'No source change needed.'
          else
            git commit -m 'fix(images): 显式传递参考图 MIME 类型'
            git push origin HEAD:main
          fi

  build-matrix:
    name: 🔨 Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    env:
      PYTHONIOENCODING: utf-8
      ASSET_NAME: nano-banana-prompt-studio-${{ matrix.platform }}-ci.zip

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: 🐧 Install Linux Deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 Build with PyInstaller
        run: python build.py

      - name: 📦 Pack Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path output/* -DestinationPath ${{ env.ASSET_NAME }}

      - name: 📦 Pack Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd output
          zip -r ../${{ env.ASSET_NAME }} *

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}
          path: ${{ env.ASSET_NAME }}
