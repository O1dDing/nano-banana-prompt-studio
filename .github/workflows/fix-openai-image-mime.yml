name: Finalize OpenAI Images MIME fix

on:
  push:
    paths:
      - '.github/workflows/fix-openai-image-mime.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Make source Python 3.10 compatible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/image_clients.py')
          text = path.read_text(encoding='utf-8')
          bad = '                f"OpenAI Images 参考图仅支持 JPEG、PNG、WebP；实际格式为 {image_format or chr(39) + "unknown" + chr(39)}"\n'
          good = '                "OpenAI Images 参考图仅支持 JPEG、PNG、WebP；实际格式为 " + (image_format or "unknown")\n'
          if bad in text:
              text = text.replace(bad, good, 1)
              path.write_text(text, encoding='utf-8')
          elif good not in text:
              raise SystemExit('expected MIME error-message line was not found')
          PY

      - name: Validate on Python 3.10
        shell: bash
        run: |
          python -m py_compile src/components/image_clients.py
          grep -q '_detect_openai_input_mime' src/components/image_clients.py
          grep -q 'upload_files.append((upload_name, file_obj, mime_type))' src/components/image_clients.py

      - name: Commit final source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/image_clients.py
          if git diff --cached --quiet; then
            echo 'Source already Python 3.10 compatible.'
          else
            git commit -m 'fix(images): 兼容 Python 3.10 的 MIME 校验'
            git push origin HEAD:main
          fi
