name: Fix OpenAI Images input MIME

on:
  push:
    paths:
      - '.github/workflows/fix-openai-image-mime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch OpenAI Images upload MIME
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/image_clients.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    def _edit_image\(self, images: list\[str\], kwargs: dict\[str, Any\]\):\n'
              r'.*?'
              r'(?=\n    @staticmethod\n    def _extract_image)',
              re.S,
          )

          replacement = '''    @staticmethod
    def _detect_openai_input_mime(image_path: str) -> tuple[str, str]:
        """按实际图片内容识别 OpenAI Images 支持的 MIME，并生成匹配扩展名的上传文件名。"""
        format_map = {
            "JPEG": ("image/jpeg", ".jpg"),
            "PNG": ("image/png", ".png"),
            "WEBP": ("image/webp", ".webp"),
        }
        try:
            with Image.open(image_path) as image:
                image_format = (image.format or "").upper()
                image.verify()
        except Exception as exc:
            raise ValueError(f"无法识别或读取参考图: {image_path}: {exc}") from exc

        if image_format not in format_map:
            raise ValueError(
                f"OpenAI Images 参考图仅支持 JPEG、PNG、WebP；实际格式为 {image_format or 'unknown'}"
            )

        mime_type, extension = format_map[image_format]
        stem = os.path.splitext(os.path.basename(image_path))[0] or "image"
        return mime_type, f"{stem}{extension}"

    def _edit_image(self, images: list[str], kwargs: dict[str, Any]):
        opened_files = []
        upload_files = []
        try:
            for image_path in images:
                if not os.path.isfile(image_path):
                    raise ValueError("OpenAI Images 编辑模式需要本地图片文件路径")

                mime_type, upload_name = self._detect_openai_input_mime(image_path)
                file_obj = open(image_path, "rb")
                opened_files.append(file_obj)
                # OpenAI Python SDK 支持 (filename, contents, media_type)。
                # 显式提供 MIME，避免 WebP/JPEG/PNG 被 multipart 退化为 application/octet-stream。
                upload_files.append((upload_name, file_obj, mime_type))

            image_arg = upload_files[0] if len(upload_files) == 1 else upload_files
            return self.client.images.edit(image=image_arg, **kwargs)
        finally:
            for file_obj in opened_files:
                file_obj.close()
'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'patch target mismatch: expected 1, got {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate syntax and patch markers
        shell: bash
        run: |
          python3 -m py_compile src/components/image_clients.py
          grep -q '_detect_openai_input_mime' src/components/image_clients.py
          grep -q 'upload_files.append((upload_name, file_obj, mime_type))' src/components/image_clients.py
          grep -q 'image/webp' src/components/image_clients.py
          grep -q 'image/jpeg' src/components/image_clients.py
          grep -q 'image/png' src/components/image_clients.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/image_clients.py
          git commit -m 'fix(images): 显式传递参考图 MIME 类型'
          git push origin HEAD:main
